[package]
name = "skingetbe-gui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri = { version = "2", features = [] }
tokio = { version = "1.35", features = ["full"] }
skingetbe = { path = "skingetbe" }
nethernet-tokio = { git = "https://github.com/bedrock-crustaceans/nethernet", package = "nethernet-tokio" }
rand = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]
