name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string
      release_title:
        description: "Release title"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Pre-release"
        required: true
        type: boolean
        default: false
      draft:
        description: "Draft release"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag name
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            binary: skingetbe-gui.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            binary: skingetbe-gui
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
            binary: skingetbe-gui
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            binary: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application and bundles
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          npm run tauri:build -- --ci --target "$TARGET" --bundles "$BUNDLES"

      - name: Collect release files
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
          BUNDLES: ${{ matrix.bundles }}
          BINARY: ${{ matrix.binary }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          output="release-files"
          root="src-tauri/target/$TARGET/release"
          safe_tag="${RELEASE_TAG//\//-}"
          mkdir -p "$output"

          if [[ -n "$BINARY" ]]; then
            test -f "$root/$BINARY"
            if [[ "$PLATFORM" == windows-* ]]; then
              cp "$root/$BINARY" "$output/SkinGetBE-$safe_tag-$PLATFORM.exe"
            else
              cp "$root/$BINARY" "$output/SkinGetBE-$safe_tag-$PLATFORM"
            fi
          fi

          shopt -s nullglob
          IFS=',' read -ra formats <<< "$BUNDLES"
          for format in "${formats[@]}"; do
            case "$format" in
              nsis) directory="nsis"; extension="exe" ;;
              deb) directory="deb"; extension="deb" ;;
              appimage) directory="appimage"; extension="AppImage" ;;
              dmg) directory="dmg"; extension="dmg" ;;
              *) echo "Unknown bundle: $format" >&2; exit 1 ;;
            esac
            files=("$root/bundle/$directory"/*."$extension")
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "Expected one $format bundle, found ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" "$output/SkinGetBE-$safe_tag-$PLATFORM-$format.$extension"
          done
          ls -lh "$output"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: skingetbe-${{ matrix.name }}
          path: release-files/*
          if-no-files-found: error
          compression-level: 0

  test:
    name: Test and lint
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/skingetbe/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets

  release:
    name: Create GitHub Release
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: skingetbe-*
          path: release
          merge-multiple: true
      - name: Verify release files
        shell: bash
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 8
          ls -lh release
      - name: Create tag (or verify existing tag)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
          if [[ -z "$existing" ]]; then
            existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          fi
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $RELEASE_TAG already points to a different commit." >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Generate release title
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          title="${RELEASE_TITLE:-Release $RELEASE_TAG}"
          title="${title//$'\n'/ }"
          title="${title//$'\r'/ }"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
